<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="96" height="96" fill="url(#profileGradient)" rx="20"/>
  
  <defs>
    <linearGradient id="profileGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8edea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fed6e3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 用户头像图标 -->
  <g transform="translate(24, 24)">
    <!-- 头像轮廓 -->
    <circle cx="24" cy="24" r="24" fill="white"/>
    <!-- 头部 -->
    <circle cx="24" cy="18" r="10" fill="#ff6b9d"/>
    <!-- 身体 -->
    <rect x="12" y="28" width="24" height="16" rx="8" fill="#ff6b9d"/>
    <!-- 装饰点 -->
    <circle cx="18" cy="16" r="2" fill="white"/>
    <circle cx="30" cy="16" r="2" fill="white"/>
  </g>
</svg>