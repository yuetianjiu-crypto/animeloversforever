<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA功能测试 - 动漫社交平台</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; color: #155724; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; color: #721c24; }
        .warning { background-color: #fff3cd; border-color: #ffeaa7; color: #856404; }
        button { padding: 10px 15px; margin: 5px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-secondary { background-color: #6c757d; color: white; }
        .status { font-weight: bold; }
    </style>
</head>
<body>
    <h1>🎯 PWA功能测试中心</h1>
    <p>测试您的动漫社交平台PWA功能是否正常工作</p>

    <div class="test-section">
        <h3>📱 PWA安装状态</h3>
        <div id="install-status">检测中...</div>
        <button onclick="checkInstallCapability()" class="btn-primary">重新检测安装能力</button>
        <button onclick="promptInstall()" id="install-button" class="btn-secondary" style="display:none;">触发安装提示</button>
    </div>

    <div class="test-section">
        <h3>🔧 Service Worker状态</h3>
        <div id="sw-status">检测中...</div>
        <button onclick="checkServiceWorker()" class="btn-primary">检查Service Worker</button>
        <button onclick="unregisterSW()" class="btn-secondary">注销Service Worker</button>
    </div>

    <div class="test-section">
        <h3>💾 缓存存储状态</h3>
        <div id="cache-status">检测中...</div>
        <button onclick="checkCaches()" class="btn-primary">检查缓存</button>
        <button onclick="clearCaches()" class="btn-secondary">清除缓存</button>
    </div>

    <div class="test-section">
        <h3>🌐 网络连接状态</h3>
        <div id="network-status">检测中...</div>
        <button onclick="checkNetwork()" class="btn-primary">检查网络</button>
    </div>

    <div class="test-section">
        <h3>📋 应用信息</h3>
        <div id="app-info">加载中...</div>
    </div>

    <script>
        let deferredPrompt = null;

        // 监听安装提示事件
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-status').innerHTML = '<span class="status success">✅ 应用可安装 - 已捕获安装提示</span>';
            document.getElementById('install-button').style.display = 'inline-block';
        });

        // 检查安装能力
        function checkInstallCapability() {
            if ('beforeinstallprompt' in window) {
                if (deferredPrompt) {
                    document.getElementById('install-status').innerHTML = '<span class="status success">✅ 应用可安装 - 安装提示已准备就绪</span>';
                } else {
                    document.getElementById('install-status').innerHTML = '<span class="status warning">⚠️ 应用可能可安装，但未触发安装提示</span>';
                }
            } else {
                document.getElementById('install-status').innerHTML = '<span class="status error">❌ 当前环境不支持PWA安装</span>';
            }
        }

        // 触发安装提示
        async function promptInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('install-status').innerHTML = '<span class="status success">✅ 用户已接受安装</span>';
                } else {
                    document.getElementById('install-status').innerHTML = '<span class="status error">❌ 用户拒绝了安装</span>';
                }
                deferredPrompt = null;
                document.getElementById('install-button').style.display = 'none';
            }
        }

        // 检查Service Worker
        async function checkServiceWorker() {
            if ('serviceWorker' in navigator) {
                try {
                    const registration = await navigator.serviceWorker.getRegistration();
                    if (registration) {
                        const status = registration.active ? '激活' : registration.waiting ? '等待' : registration.installing ? '安装中' : '未知';
                        document.getElementById('sw-status').innerHTML = `<span class="status success">✅ Service Worker已注册 - 状态: ${status}</span>`;
                    } else {
                        document.getElementById('sw-status').innerHTML = '<span class="status error">❌ Service Worker未注册</span>';
                    }
                } catch (error) {
                    document.getElementById('sw-status').innerHTML = `<span class="status error">❌ Service Worker错误: ${error.message}</span>`;
                }
            } else {
                document.getElementById('sw-status').innerHTML = '<span class="status error">❌ 浏览器不支持Service Worker</span>';
            }
        }

        // 注销Service Worker
        async function unregisterSW() {
            if ('serviceWorker' in navigator) {
                try {
                    const registration = await navigator.serviceWorker.getRegistration();
                    if (registration) {
                        await registration.unregister();
                        document.getElementById('sw-status').innerHTML = '<span class="status warning">⚠️ Service Worker已注销</span>';
                    }
                } catch (error) {
                    document.getElementById('sw-status').innerHTML = `<span class="status error">❌ 注销失败: ${error.message}</span>`;
                }
            }
        }

        // 检查缓存
        async function checkCaches() {
            if ('caches' in window) {
                try {
                    const cacheNames = await caches.keys();
                    if (cacheNames.length > 0) {
                        let cacheInfo = '<span class="status success">✅ 缓存存储可用</span><br>缓存列表:<br>';
                        for (const name of cacheNames) {
                            const cache = await caches.open(name);
                            const keys = await cache.keys();
                            cacheInfo += `  - ${name}: ${keys.length} 个资源<br>`;
                        }
                        document.getElementById('cache-status').innerHTML = cacheInfo;
                    } else {
                        document.getElementById('cache-status').innerHTML = '<span class="status warning">⚠️ 缓存存储可用，但暂无缓存</span>';
                    }
                } catch (error) {
                    document.getElementById('cache-status').innerHTML = `<span class="status error">❌ 缓存检查失败: ${error.message}</span>`;
                }
            } else {
                document.getElementById('cache-status').innerHTML = '<span class="status error">❌ 浏览器不支持缓存存储</span>';
            }
        }

        // 清除缓存
        async function clearCaches() {
            if ('caches' in window) {
                try {
                    const cacheNames = await caches.keys();
                    await Promise.all(cacheNames.map(name => caches.delete(name)));
                    document.getElementById('cache-status').innerHTML = '<span class="status warning">⚠️ 所有缓存已清除</span>';
                } catch (error) {
                    document.getElementById('cache-status').innerHTML = `<span class="status error">❌ 清除缓存失败: ${error.message}</span>`;
                }
            }
        }

        // 检查网络
        function checkNetwork() {
            const online = navigator.onLine;
            if (online) {
                document.getElementById('network-status').innerHTML = '<span class="status success">✅ 网络连接正常</span>';
            } else {
                document.getElementById('network-status').innerHTML = '<span class="status error">❌ 网络连接断开</span>';
            }
        }

        // 显示应用信息
        function showAppInfo() {
            const manifest = '/manifest.json';
            fetch(manifest)
                .then(response => response.json())
                .then(data => {
                    let info = '<span class="status success">✅ Manifest加载成功</span><br>';
                    info += `应用名称: ${data.name || '未设置'}<br>`;
                    info += `短名称: ${data.short_name || '未设置'}<br>`;
                    info += `版本: ${data.version || '未设置'}<br>`;
                    info += `描述: ${data.description || '未设置'}<br>`;
                    info += `主题色: ${data.theme_color || '未设置'}<br>`;
                    info += `背景色: ${data.background_color || '未设置'}<br>`;
                    info += `图标数量: ${data.icons ? data.icons.length : 0} 个<br>`;
                    document.getElementById('app-info').innerHTML = info;
                })
                .catch(error => {
                    document.getElementById('app-info').innerHTML = `<span class="status error">❌ Manifest加载失败: ${error.message}</span>`;
                });
        }

        // 页面加载时执行检查
        window.addEventListener('load', () => {
            checkInstallCapability();
            checkServiceWorker();
            checkCaches();
            checkNetwork();
            showAppInfo();
        });

        // 监听网络状态变化
        window.addEventListener('online', checkNetwork);
        window.addEventListener('offline', checkNetwork);
    </script>
</body>
</html>
