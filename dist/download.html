        <div class="qr-section">

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script>
        // 多语言支持
        const translations = {
            zh: {
                appTitle: '动漫社交平台',
                appSubtitle: '全球可安装的PWA应用 - 支持iOS、Android、桌面全平台',
                installBtn: '📱 立即安装应用',
                featuresTitle: '为什么选择我们的应用？',
                feature1: '全球CDN加速，快速访问',
                feature2: '全平台支持，一键安装',
                feature3: '离线使用，无网络也能浏览',
                feature4: '占用空间小，轻量级应用',
                feature5: '自动更新，无需手动操作',
                feature6: '安全可靠，隐私保护',
                qrText: '扫码访问或直接分享',
                copyBtn: '📋 复制链接',
                copySuccess: '链接已复制到剪贴板！',

            },
            en: {
                appTitle: 'Anime Social Platform',
                appSubtitle: 'Globally installable PWA app - Support iOS, Android, Desktop',
                installBtn: '📱 Install App Now',
                featuresTitle: 'Why choose our app?',
                feature1: 'Global CDN acceleration, fast access',
                feature2: 'All platform support, one-click install',
                feature3: 'Offline use, browse without network',
                feature4: 'Small size, lightweight app',
                feature5: 'Auto update, no manual operation',
                feature6: 'Safe and secure, privacy protection',
                qrText: 'Scan QR code or share directly',
                copyBtn: '📋 Copy Link',
                copySuccess: 'Link copied to clipboard!',
                installSuccess: 'App installed successfully!',
                installFailed: 'Installation failed, please check installation guide'
            },
            ja: {
                appTitle: 'アニメソーシャルプラットフォーム',
                appSubtitle: 'グローバルにインストール可能なPWAアプリ - iOS、Android、デスクトップをサポート',
                installBtn: '📱 アプリを今すぐインストール',
                featuresTitle: 'なら私たちのアプリを選ぶのですか？',
                feature1: 'グローバルCDN加速、高速アクセス',
                feature2: '全プラットフォームサポート、ワンクリックインストール',
                feature3: 'オフライン使用、ネットワークなしで閲覧',
                feature4: 'サイズが小さい、軽量アプリ',
                feature5: '自動更新、手動操作なし',
                feature6: '安全で安全、プライバシー保護',
                qrText: 'QRコードをスキャンまたは直接共有',
                copyBtn: '📋 リンクをコピー',
                copySuccess: 'リンクがクリップボードにコピーされました！',
                installSuccess: 'アプリが正常にインストールされました！',
                installFailed: 'インストールに失敗しました、インストールガイドを確認してください'
            },
            ko: {
                appTitle: '애니메이션 소셜 플랫폼',
                appSubtitle: '전 세계에서 설치 가능한 PWA 앱 - iOS, Android, 데스크톱 지원',
                installBtn: '📱 지금 앱 설치',
                featuresTitle: '왜 우리 앱을 선택해야 합니까?',
                feature1: '전 세계 CDN 가속, 빠른 액세스',
                feature2: '모든 플랫폼 지원, 원클릭 설치',
                feature3: '오프라인 사용, 네트워크 없이도 브라우징',
                feature4: '작은 크기, 가벼운 앱',
                feature5: '자동 업데이트, 수동 작업 없음',
                feature6: '안전하고 안전, 개인 정보 보호',
                qrText: 'QR 코드 스캔 또는 직접 공유',
                copyBtn: '📋 링크 복사',
                copySuccess: '링크가 클립보드에 복사되었습니다!',
                installSuccess: '앱이 성공적으로 설치되었습니다!',
                installFailed: '설치에 실패했습니다. 설치 가이드를 확인하세요.'
            }
        };

        let currentLang = 'zh';

        // 语言切换
        document.getElementById('languageSelector').addEventListener('change', function(e) {
            currentLang = e.target.value;
            updateLanguage();
        });

        function updateLanguage() {
            const t = translations[currentLang];
            document.getElementById('appTitle').textContent = t.appTitle;
            document.getElementById('appSubtitle').textContent = t.appSubtitle;
            document.getElementById('installBtn').textContent = t.installBtn;
            document.getElementById('featuresTitle').textContent = t.featuresTitle;
            document.getElementById('feature1').textContent = t.feature1;
            document.getElementById('feature2').textContent = t.feature2;
            document.getElementById('feature3').textContent = t.feature3;
            document.getElementById('feature4').textContent = t.feature4;
            document.getElementById('feature5').textContent = t.feature5;
            document.getElementById('feature6').textContent = t.feature6;
            document.getElementById('qrText').textContent = t.qrText;
            document.getElementById('copyBtn').textContent = t.copyBtn;
        }

        // 生成QR码
        new QRCode(document.getElementById("qrCode"), {
            text: window.location.origin,
            width: 150,
            height: 150,
            colorDark : "#333333",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        // 安装应用
        function installApp() {
            const installBtn = document.getElementById('installBtn');
            installBtn.classList.add('loading');
            
            // 尝试PWA安装
            if (window.deferredPrompt) {
                window.deferredPrompt.prompt();
                window.deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        showMessage(translations[currentLang].installSuccess, 'success');
                    } else {
                        showMessage(translations[currentLang].installFailed, 'error');
                    }
                    window.deferredPrompt = null;
                    installBtn.classList.remove('loading');
                });
            } else {
                // 显示安装指南
                detectPlatformAndGuide();
                installBtn.classList.remove('loading');
            }
        }

        // 显示安装指南
        function showInstallGuide(platform) {
            let guide = '';
            const t = translations[currentLang];
            
            switch(platform) {
                case 'ios':
                    guide = `
                        <h3>📱 iPhone/iPad 安装指南</h3>
                        <div style="text-align: left; margin: 20px 0;">
                            <p><strong>步骤 1:</strong> 在 Safari 浏览器中打开本网站</p>
                            <p><strong>步骤 2:</strong> 点击底部分享按钮 (📤)</p>
                            <p><strong>步骤 3:</strong> 选择"添加到主屏幕"</p>
                            <p><strong>步骤 4:</strong> 点击右上角"添加"按钮</p>
                        </div>
                    `;
                    break;
                case 'android':
                    guide = `
                        <h3>📱 Android 安装指南</h3>
                        <div style="text-align: left; margin: 20px 0;">
                            <p><strong>步骤 1:</strong> 在 Chrome 浏览器中打开本网站</p>
                            <p><strong>步骤 2:</strong> 点击右上角菜单按钮 (⋮)</p>
                            <p><strong>步骤 3:</strong> 选择"安装应用"或"添加到主屏幕"</p>
                            <p><strong>步骤 4:</strong> 按照提示完成安装</p>
                        </div>
                    `;
                    break;
                case 'desktop':
                    guide = `
                        <h3>💻 桌面安装指南</h3>
                        <div style="text-align: left; margin: 20px 0;">
                            <p><strong>步骤 1:</strong> 在 Chrome 或 Edge 浏览器中打开本网站</p>
                            <p><strong>步骤 2:</strong> 点击地址栏右侧的安装图标 (➕)</p>
                            <p><strong>步骤 3:</strong> 或点击浏览器菜单中的"安装应用"</p>
                            <p><strong>步骤 4:</strong> 按照提示完成安装</p>
                        </div>
                    `;
                    break;
            }
            
            showModal(guide);
        }

        // 自动检测平台并显示指南
        function detectPlatformAndGuide() {
            const userAgent = navigator.userAgent.toLowerCase();
            let platform = 'desktop';
            
            if (/iphone|ipad|ipod/.test(userAgent)) {
                platform = 'ios';
            } else if (/android/.test(userAgent)) {
                platform = 'android';
            }
            
            showInstallGuide(platform);
        }

        // 复制链接
        function copyUrl() {
            const url = window.location.origin;
            navigator.clipboard.writeText(url).then(() => {
                const btn = document.getElementById('copyBtn');
                const originalText = btn.textContent;
                btn.textContent = translations[currentLang].copySuccess;
                btn.classList.add('copied');
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('copied');
                }, 2000);
            });
        }

        // 显示消息
        function showMessage(message, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `success-message ${type === 'error' ? 'error' : ''}`;
            messageDiv.textContent = message;
            messageDiv.style.background = type === 'error' ? '#f44336' : '#4CAF50';
            
            document.querySelector('.download-container').appendChild(messageDiv);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 3000);
        }

        // 显示模态框
        function showModal(content) {
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0,0,0,0.8);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 10000;
                animation: fadeIn 0.3s ease;
            `;
            
            modal.innerHTML = `
                <div style="
                    background: white;
                    border-radius: 20px;
                    padding: 30px;
                    max-width: 400px;
                    margin: 20px;
                    animation: slideUp 0.3s ease;
                ">
                    ${content}
                    <button onclick="this.closest('.modal').remove()" style="
                        width: 100%;
                        padding: 12px;
                        background: linear-gradient(135deg, #667eea, #764ba2);
                        color: white;
                        border: none;
                        border-radius: 10px;
                        font-size: 16px;
                        font-weight: 600;
                        cursor: pointer;
                        margin-top: 20px;
                    ">知道了</button>
                </div>
            `;
            
            modal.className = 'modal';
            modal.onclick = (e) => {
                if (e.target === modal) {
                    modal.remove();
                }
            };
            
            document.body.appendChild(modal);
        }

        // 页面加载完成
        document.addEventListener('DOMContentLoaded', function() {
            updateLanguage();
            
            // 检查是否已安装
            if (window.matchMedia('(display-mode: standalone)').matches) {
                document.getElementById('installBtn').style.display = 'none';
                showMessage('应用已安装！', 'success');
            }
        });

        // 添加动画样式
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                from { opacity: 0; }
                to { opacity: 1; }
            }
            
            @keyframes slideUp {
                from { transform: translateY(50px); opacity: 0; }
                to { transform: translateY(0); opacity: 1; }
            }
            
            .loading {
                opacity: 0.7;
                pointer-events: none;
            }
            
            .error {
                background: #f44336 !important;
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
