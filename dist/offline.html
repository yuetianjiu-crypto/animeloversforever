<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>离线模式 - 动漫社交平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .offline-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .offline-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #ff6b9d, #ff8e53);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .offline-icon svg {
            width: 40px;
            height: 40px;
            fill: white;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        p {
            color: #666;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .retry-button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .retry-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .retry-button:active {
            transform: translateY(0);
        }

        .features {
            text-align: left;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .features h3 {
            color: #333;
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .features h3 svg {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            fill: #667eea;
        }

        .feature-list {
            list-style: none;
        }

        .feature-list li {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
            padding-left: 20px;
            position: relative;
        }

        .feature-list li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #667eea;
            font-weight: bold;
        }

        .download-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .download-button {
            display: inline-flex;
            align-items: center;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .download-button:hover {
            background: #45a049;
            transform: translateY(-1px);
        }

        .download-button svg {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            fill: white;
        }

        @media (max-width: 480px) {
            .offline-container {
                padding: 30px 20px;
                margin: 10px;
            }

            h1 {
                font-size: 20px;
            }

            p {
                font-size: 14px;
            }

            .offline-icon {
                width: 60px;
                height: 60px;
            }

            .offline-icon svg {
                width: 30px;
                height: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">
            <svg viewBox="0 0 24 24">
                <path d="M1 9l6 6v8h4v-6h4v6h4v-8l6-6M7 2v4.03M17 2v4.03M3 9h18M4 9v11h16V9M12 2v4.03"/>
            </svg>
        </div>
        
        <h1>网络连接已断开</h1>
        <p>您当前处于离线模式，某些功能可能无法使用。请检查网络连接或稍后再试。</p>
        
        <button class="retry-button" onclick="window.location.reload()">
            重新连接
        </button>

        <div class="features">
            <h3>
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
                离线功能
            </h3>
            <ul class="feature-list">
                <li>已缓存的内容可正常浏览</li>
                <li>个人资料页面离线可查看</li>
                <li>已加载的动态和图片</li>
                <li>本地收藏和设置</li>
            </ul>
        </div>

        <div class="download-section">
            <p style="font-size: 14px; color: #888;">想要更好的体验？</p>
            <a href="#" class="download-button" onclick="downloadApp()">
                <svg viewBox="0 0 24 24">
                    <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                </svg>
                下载应用
            </a>
        </div>
    </div>

    <script>
        // 自动检测网络状态
        window.addEventListener('online', function() {
            setTimeout(() => {
                window.location.reload();
            }, 1000);
        });

        // 下载应用功能
        function downloadApp() {
            // 检测用户设备类型
            const userAgent = navigator.userAgent.toLowerCase();
            const isIOS = /iphone|ipad|ipod/.test(userAgent);
            const isAndroid = /android/.test(userAgent);
            
            if (isIOS) {
                // iOS 用户引导到 App Store 或显示安装说明
                alert('请在 Safari 浏览器中点击分享按钮，然后选择"添加到主屏幕"来安装应用');
            } else if (isAndroid) {
                // Android 用户可以直接安装 PWA
                if ('beforeinstallprompt' in window) {
                    // 触发 PWA 安装提示
                    window.deferredPrompt.prompt();
                } else {
                    alert('请使用 Chrome 浏览器，点击菜单中的"安装应用"来安装');
                }
            } else {
                // 桌面用户
                alert('您可以在支持的浏览器中安装此应用作为桌面应用');
            }
        }

        // 监听 PWA 安装事件
        let deferredPrompt;
        
        window.addEventListener('beforeinstallprompt', (e) => {
            // 防止立即显示
            e.preventDefault();
            // 存储事件以便后续使用
            deferredPrompt = e;
            // 可以在这里显示自定义的安装按钮
            console.log('PWA 安装已准备就绪');
        });

        window.addEventListener('appinstalled', () => {
            console.log('PWA 安装成功');
        });

        // 页面加载完成后的初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 添加页面动画效果
            const container = document.querySelector('.offline-container');
            container.style.opacity = '0';
            container.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                container.style.transition = 'all 0.5s ease-out';
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body>
</html>
