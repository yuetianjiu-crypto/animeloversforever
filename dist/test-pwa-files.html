<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA文件测试 - 404错误检测</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .test-item {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .loading {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
        }
        .status {
            font-weight: bold;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .summary {
            text-align: center;
            margin: 20px 0;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>🧪 PWA文件404错误检测</h1>
    <div class="summary" id="summary">正在检测文件...</div>
    <div id="test-results"></div>

    <script>
        // 要测试的PWA相关文件列表
        const testFiles = [
            '/sw.js',
            '/install.js',
            '/offline.html',
            '/download.html',
            '/manifest.json',
            '/favicon.svg',
            '/icons/app-icon-192.svg',
            '/icons/app-icon-512.svg',
            '/screenshots/splash-screen.svg',
            '/images/default-avatar.png',
            '/images/default-post.png',
            '/test-pwa-files.html'
        ];

        const resultsContainer = document.getElementById('test-results');
        const summaryElement = document.getElementById('summary');
        let successCount = 0;
        let errorCount = 0;
        let totalCount = testFiles.length;

        function testFile(url) {
            const testItem = document.createElement('div');
            testItem.className = 'test-item loading';
            testItem.innerHTML = `
                <span>正在检测: <code>${url}</code></span>
                <span class="status">⏳ 检测中...</span>
            `;
            resultsContainer.appendChild(testItem);

            fetch(url, { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        testItem.className = 'test-item success';
                        testItem.innerHTML = `
                            <span>✅ <code>${url}</code></span>
                            <span class="status">200 OK</span>
                        `;
                        successCount++;
                    } else {
                        testItem.className = 'test-item error';
                        testItem.innerHTML = `
                            <span>❌ <code>${url}</code></span>
                            <span class="status">${response.status} ${response.statusText}</span>
                        `;
                        errorCount++;
                    }
                    updateSummary();
                })
                .catch(error => {
                    testItem.className = 'test-item error';
                    testItem.innerHTML = `
                        <span>❌ <code>${url}</code></span>
                        <span class="status">网络错误: ${error.message}</span>
                    `;
                    errorCount++;
                    updateSummary();
                });
        }

        function updateSummary() {
            if (successCount + errorCount === totalCount) {
                summaryElement.innerHTML = `
                    检测完成！ ✅ 成功: ${successCount} | ❌ 失败: ${errorCount} | 📊 总计: ${totalCount}
                `;
                
                if (errorCount === 0) {
                    summaryElement.style.color = '#155724';
                    summaryElement.style.backgroundColor = '#d4edda';
                    summaryElement.style.padding = '10px';
                    summaryElement.style.borderRadius = '5px';
                } else {
                    summaryElement.style.color = '#856404';
                    summaryElement.style.backgroundColor = '#fff3cd';
                    summaryElement.style.padding = '10px';
                    summaryElement.style.borderRadius = '5px';
                }
            }
        }

        // 开始测试所有文件
        testFiles.forEach(file => testFile(file));

        // 额外的Service Worker状态检测
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistration().then(registration => {
                const swStatus = document.createElement('div');
                swStatus.className = 'test-item';
                
                if (registration) {
                    swStatus.className += ' success';
                    swStatus.innerHTML = `
                        <span>🔧 Service Worker 状态</span>
                        <span class="status">✅ 已注册 (${registration.scope})</span>
                    `;
                } else {
                    swStatus.className += ' error';
                    swStatus.innerHTML = `
                        <span>🔧 Service Worker 状态</span>
                        <span class="status">❌ 未注册</span>
                    `;
                }
                resultsContainer.appendChild(swStatus);
            });
        }

        // 检测PWA安装能力
        const pwaSupport = document.createElement('div');
        pwaSupport.className = 'test-item';
        
        if ('serviceWorker' in navigator && 'BeforeInstallPromptEvent' in window) {
            pwaSupport.className += ' success';
            pwaSupport.innerHTML = `
                <span>📱 PWA安装支持</span>
                <span class="status">✅ 支持安装</span>
            `;
        } else if ('serviceWorker' in navigator) {
            pwaSupport.className += ' loading';
            pwaSupport.innerHTML = `
                <span>📱 PWA安装支持</span>
                <span class="status">⚠️ 部分支持 (iOS Safari)</span>
            `;
        } else {
            pwaSupport.className += ' error';
            pwaSupport.innerHTML = `
                <span>📱 PWA安装支持</span>
                <span class="status">❌ 不支持</span>
            `;
        }
        resultsContainer.appendChild(pwaSupport);
    </script>
</body>
</html>
