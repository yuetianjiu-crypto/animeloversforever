<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 渐变背景 - 粉色系 -->
  <defs>
    <linearGradient id="splashGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB3D9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF8FB1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B9D;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="390" height="844" fill="url(#splashGradient)"/>
  
  <!-- 中央可爱的兔子角色 -->
  <g transform="translate(195, 422)">
    <!-- 兔子耳朵 -->
    <ellipse cx="-60" cy="-120" rx="25" ry="50" fill="white" transform="rotate(-15 -60 -120)"/>
    <ellipse cx="60" cy="-120" rx="25" ry="50" fill="white" transform="rotate(15 60 -120)"/>
    <!-- 耳朵内部 -->
    <ellipse cx="-55" cy="-120" rx="12" ry="30" fill="#FFB3D9" transform="rotate(-15 -55 -120)"/>
    <ellipse cx="55" cy="-120" rx="12" ry="30" fill="#FFB3D9" transform="rotate(15 55 -120)"/>
    <!-- 兔子头部 -->
    <circle cx="0" cy="-40" r="70" fill="white"/>
    <!-- 兔子眼睛 -->
    <circle cx="-25" cy="-50" r="6" fill="#FF6B9D"/>
    <circle cx="25" cy="-50" r="6" fill="#FF6B9D"/>
    <!-- 兔子鼻子 -->
    <ellipse cx="0" cy="-30" rx="5" ry="3" fill="#FF6B9D"/>
    <!-- 兔子嘴巴 -->
    <path d="M-20 -15 Q0 -5 20 -15" fill="none" stroke="#FF6B9D" stroke-width="3" stroke-linecap="round"/>
    <!-- 兔子身体 -->
    <ellipse cx="0" cy="20" rx="50" ry="40" fill="white"/>
    <!-- 兔子前爪 -->
    <circle cx="-35" cy="35" r="12" fill="white"/>
    <circle cx="35" cy="35" r="12" fill="white"/>
  </g>
  
  <!-- "Hi~" 文字 -->
  <text x="195" y="650" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="48" font-weight="bold" letter-spacing="3">
    Hi~
  </text>
  
  <!-- 底部应用名称 -->
  <text x="195" y="720" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" opacity="0.9">
    动漫社交平台
  </text>
  
  <!-- 装饰星星 -->
  <path d="M60 120 L63 129 L72 129 L66 135 L69 144 L60 137 L51 144 L54 135 L48 129 L57 129 Z" fill="white" opacity="0.6"/>
  <path d="M330 120 L333 129 L342 129 L336 135 L339 144 L330 137 L321 144 L324 135 L318 129 L327 129 Z" fill="white" opacity="0.6"/>
  <path d="M195 80 L198 89 L207 89 L201 95 L204 104 L195 97.5 L186 104 L189 95 L183 89 L192 89 Z" fill="white" opacity="0.8"/>
  
  <!-- 小装饰点 -->
  <circle cx="50" cy="200" r="4" fill="white" opacity="0.4"/>
  <circle cx="340" cy="200" r="3" fill="white" opacity="0.3"/>
  <circle cx="80" cy="700" r="5" fill="white" opacity="0.35"/>
  <circle cx="310" cy="700" r="6" fill="white" opacity="0.25"/>
</svg>