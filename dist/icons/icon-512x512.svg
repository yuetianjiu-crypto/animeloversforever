      <rect x="216" y="360" width="40" height="80" rx="20" fill="black"/>
      <rect cx="256" cy="360" width="40" height="80" rx="20" fill="black"/>
    </mask>
  </defs>
  
  <!-- 背景 -->
  <rect width="512" height="512" fill="url(#bgGradient512)" rx="64"/>
  
  <!-- 角色剪影 -->
  <rect width="512" height="512" fill="white" mask="url(#characterMask512)" opacity="0.9"/>
  
  <!-- 装饰元素 -->
