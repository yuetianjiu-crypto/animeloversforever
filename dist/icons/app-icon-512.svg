<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 - 粉色系 -->
  <defs>
    <linearGradient id="pinkGradient512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB3D9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF8FB1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B9D;stop-opacity:1" />
    </linearGradient>
    
    <!-- 可爱的兔子角色 -->
    <mask id="cuteBunnyMask512">
      <rect width="512" height="512" fill="white"/>
      <!-- 兔子耳朵 -->
      <ellipse cx="173" cy="120" rx="32" ry="67" fill="black" transform="rotate(-15 173 120)"/>
      <ellipse cx="339" cy="120" rx="32" ry="67" fill="black" transform="rotate(15 339 120)"/>
      <!-- 耳朵内部 -->
      <ellipse cx="181" cy="120" rx="16" ry="40" fill="white" transform="rotate(-15 181 120)"/>
      <ellipse cx="331" cy="120" rx="16" ry="40" fill="white" transform="rotate(15 331 120)"/>
      <!-- 兔子头部 -->
      <circle cx="256" cy="227" r="93" fill="black"/>
      <!-- 兔子眼睛 -->
      <circle cx="218" cy="213" r="10" fill="white"/>
      <circle cx="294" cy="213" r="10" fill="white"/>
      <!-- 兔子鼻子 -->
      <ellipse cx="256" cy="245" rx="8" ry="5" fill="white"/>
      <!-- 兔子嘴巴 -->
      <path d="M235 265 Q256 280 277 265" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>
      <!-- 兔子身体 -->
      <ellipse cx="256" cy="347" rx="67" ry="53" fill="black"/>
      <!-- 兔子前爪 -->
      <circle cx="208" cy="373" r="16" fill="black"/>
      <circle cx="304" cy="373" r="16" fill="black"/>
    </mask>
  </defs>
  
  <!-- 背景 -->
  <rect width="512" height="512" fill="url(#pinkGradient512)" rx="64"/>
  
  <!-- 可爱的兔子角色 -->
  <rect width="512" height="512" fill="white" mask="url(#cuteBunnyMask512)"/>
  
  <!-- "Hi~" 文字 -->
  <text x="256" y="453" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="64" font-weight="bold" letter-spacing="4">
    Hi~
  </text>
  
  <!-- 装饰星星 -->
  <path d="M80 80 L83 89 L92 89 L85 95 L88 104 L80 97.5 L72 104 L75 95 L68 89 L77 89 Z" fill="white" opacity="0.6"/>
  <path d="M432 80 L435 89 L444 89 L437 95 L440 104 L432 97.5 L424 104 L427 95 L420 89 L429 89 Z" fill="white" opacity="0.6"/>
  <path d="M256 53 L259 62 L268 62 L261 68 L264 77 L256 70.5 L248 77 L251 68 L244 62 L253 62 Z" fill="white" opacity="0.8"/>
  
  <!-- 小装饰点 -->
  <circle cx="67" cy="67" r="8" fill="white" opacity="0.4"/>
  <circle cx="445" cy="67" r="5" fill="white" opacity="0.3"/>
  <circle cx="67" cy="445" r="6.5" fill="white" opacity="0.35"/>
  <circle cx="445" cy="445" r="9" fill="white" opacity="0.25"/>
</svg>