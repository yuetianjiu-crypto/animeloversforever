    <path d="M22 36 L18 40 L22 40 Z" fill="white"/>
    <!-- 橡皮擦 -->
    <rect x="20" y="4" width="4" height="6" fill="#ff6b9d" rx="1"/>
    <!-- 装饰线 -->
    <line x1="20" y1="12" x2="24" y2="12" stroke="#4facfe" stroke-width="1"/>
    <line x1="20" y1="16" x2="24" y2="16" stroke="#4facfe" stroke-width="1"/>
    <line x1="20" y1="20" x2="24" y2="20" stroke="#4facfe" stroke-width="1"/>
