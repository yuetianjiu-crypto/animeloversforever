<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二次元小窝 - 专属ACG爱好者的社交平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: bounce 2s infinite;
        }

        .title {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 2rem;
        }

        .status-card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }

        .status-header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            color: #f59e0b;
        }

        .status-header svg {
            width: 24px;
            height: 24px;
            margin-right: 0.5rem;
        }

        .status-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #92400e;
        }

        .status-text {
            color: #b45309;
            margin-bottom: 1rem;
        }

        .steps {
            text-align: left;
            background: #fef3c7;
            border-radius: 12px;
            padding: 1rem;
            margin: 1rem 0;
        }

        .steps p {
            margin: 0.5rem 0;
            font-size: 0.9rem;
            color: #92400e;
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .feature {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .feature-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .feature-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .feature-desc {
            font-size: 0.9rem;
            color: #666;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2rem;
            }
            
            .logo {
                font-size: 3rem;
            }
            
            .features {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🌸</div>
        <h1 class="title">二次元小窝</h1>
        <p class="subtitle">专属ACG爱好者的社交平台</p>
        
        <div class="status-card">
            <div class="status-header">
                <svg fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
                </svg>
                <span class="status-title">需要配置Supabase</span>
            </div>
            <p class="status-text">
                您的应用正在运行，但需要配置Supabase才能正常使用所有功能
            </p>
            <div class="steps">
                <p><strong>配置步骤：</strong></p>
                <p>1. 访问 <strong>supabase.com</strong> 创建免费账户</p>
                <p>2. 创建新项目并获取项目URL和匿名密钥</p>
                <p>3. 在项目根目录创建 <strong>.env</strong> 文件</p>
                <p>4. 添加配置信息并重启应用</p>
            </div>
        </div>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">🔐</div>
                <div class="feature-title">用户认证</div>
                <div class="feature-desc">安全的邮箱注册登录系统</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📱</div>
                <div class="feature-title">内容发布</div>
                <div class="feature-desc">支持图片和文字内容发布</div>
            </div>
            <div class="feature">
                <div class="feature-icon">💖</div>
                <div class="feature-title">互动功能</div>
                <div class="feature-desc">点赞、收藏、评论系统</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🎨</div>
                <div class="feature-title">二次元UI</div>
                <div class="feature-desc">精美的动漫风格界面设计</div>
            </div>
        </div>

        <a href="#" class="button" onclick="window.location.reload()">
            🔄 重新加载应用
        </a>
    </div>
</body>
</html>
